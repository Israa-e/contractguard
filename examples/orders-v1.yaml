openapi: 3.0.3
info:
  title: Delivery Orders API
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /orders:
    get:
      operationId: listOrders
      parameters:
        - name: limit
          in: query
          schema: { type: integer, maximum: 100 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: A page of orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewOrder' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404':
          description: Not found
    delete:
      operationId: cancelOrder
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Cancelled
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    OrderStatus:
      type: string
      enum: [pending, preparing, on_the_way, delivered]
    Order:
      type: object
      required: [id, status, total, customer]
      properties:
        id: { type: integer, readOnly: true }
        status: { $ref: '#/components/schemas/OrderStatus' }
        total: { type: number }
        note: { type: string, nullable: true }
        customer: { $ref: '#/components/schemas/Customer' }
    Customer:
      type: object
      required: [name, phone]
      properties:
        name: { type: string }
        phone: { type: string }
    NewOrder:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: integer }
              quantity: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 500 }
