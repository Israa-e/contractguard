# Copy into .github/workflows/api-contract.yml in the repository that owns the API.
# Fails the pull request when openapi.yaml changes in a backwards-incompatible way,
# and posts the report to the job summary.
name: API contract

on:
  pull_request:
    paths: ['openapi.yaml']

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      # --base reads the base branch from git. The default shallow checkout (fetch-depth: 1)
      # only fetches the pull request's merge commit, so origin/<base branch> would not exist.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Installed into its own directory: a global (-g) install from GitHub fails,
      # because npm skips the dependencies it needs to build the package.
      - name: Install ContractGuard
        run: |
          npm install --prefix "$RUNNER_TEMP/contractguard" github:Israa-e/contractguard
          echo "$RUNNER_TEMP/contractguard/node_modules/.bin" >> "$GITHUB_PATH"

      # github.base_ref is set on pull_request events. It goes through env rather than being
      # inlined into the script, as GitHub recommends for expressions used in shell commands.
      # The default shell has no pipefail, so PIPESTATUS carries ContractGuard's exit code past tee.
      - name: Check compatibility with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          contractguard check --base "origin/$BASE_REF" openapi.yaml --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
